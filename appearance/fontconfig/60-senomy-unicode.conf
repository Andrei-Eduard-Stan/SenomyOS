<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Append coverage without replacing the user's preferred interface fonts. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans Symbols2</string>
      <string>Noto Sans Math</string>
      <string>Noto Sans Egyptian Hieroglyphs</string>
      <string>Noto Serif Tibetan</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
