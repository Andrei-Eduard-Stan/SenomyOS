# Generated by scripts/generate-appearance.py. Do not edit directly.
# SenomyOS authentication Island. Centred per output; live compositor backdrop; requires both session-lock options.
# 320px panel / 264px field fit the supported 360px minimum logical width.
# Positive Hyprlock y offsets move upwards. No clickable command widgets.
general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1800
}

auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier = senomyFast, 0.15, 0, 0.1, 1
    animation = fade, 1, 2.0, senomyFast
    animation = inputField, 1, 1.8, senomyFast
}

background {
    monitor =
    path =
    color = rgba(8, 10, 12, 0.12)
    blur_passes = 4
    blur_size = 8
    noise = 0.003
    contrast = 0.92
    brightness = 0.72
    vibrancy = 0.10
    vibrancy_darkness = 0.0
    zindex = -2
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(8, 9, 11, 0.52)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = -1
}

image {
    monitor =
    path = $XDG_DATA_HOME/senomyos/appearance/frames/auth-surface.png
    size = 320
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
