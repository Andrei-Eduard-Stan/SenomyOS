# Generated by scripts/generate-appearance.py. Do not edit directly.
# SenomyOS Luminous Reliquary lock surface.
# The five 170px instruments use exact Compact-tier Rail frame projections and
# the Rail's 22px inter-island rhythm. Utility marks remain non-interactive.

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1800
}

auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier = senomyFast, 0.15, 0, 0.1, 1
    animation = fade, 1, 2.0, senomyFast
    animation = inputField, 1, 1.8, senomyFast
}

background {
    monitor =
    path = screenshot
    color = rgba(8, 9, 11, 1.00)
    blur_passes = 4
    blur_size = 8
    noise = 0.003
    contrast = 0.92
    brightness = 0.72
    vibrancy = 0.10
    vibrancy_darkness = 0.0
    zindex = -2
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(8, 9, 11, 0.32)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = -1
}

